# 1. spring.application.name 속성 : 현재 애플리케이션의 이름을 지정하는 설정 키(key)입니다.
#    값(firstproject)은 로그(실행 기록) 출력이나 스프링 클라우드 환경에서 서비스 식별용으로 사용됩니다.
spring.application.name=firstproject

# 2. server.port 속성 : 내장 톰캣 서버가 요청을 받을 포트 번호를 지정합니다.
#    스프링 부트의 기본값은 8080번인데, 아래처럼 값을 지정하면 그 값으로 덮어씁니다(override).
#    포트 번호를 8080에서 8070으로 변경하는 설정입니다.
server.port=8070

# 3. server.servlet.encoding.force 속성 : 요청(request)과 응답(response) 양쪽 모두에
#    강제로 문자 인코딩(문자를 컴퓨터가 표현하는 방식)을 적용하겠다는 설정입니다.
#    값을 true로 설정하면, 브라우저와 서버가 주고받는 한글 문자가 깨지는 현상(예: ?? , ???? 로 표시되는 문제)을
#    방지하기 위해 UTF-8 인코딩을 강제로 사용합니다.
server.servlet.encoding.force=true

# 4. H2 DB에 웹 콘솔로 접근하기 위해 값을 true로 설정
spring.h2.console.enabled=true

spring.jpa.defer-datasource-initialization=true

# JPA 로깅 설정
# 디버그 레벨로 쿼리(SQL문) 출력
logging.level.org.hibernate.SQL=DEBUG

# SQL 포매팅: 출력되는 SQL을 줄바꿈과 들여쓰기를 통해 읽기 쉬운 형태로 출력
spring.jpa.properties.hibernate.format_sql=true

# 바인딩 파라미터 출력: SQL의 ? 자리에 들어간 값을 로그로 출력
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# DB URL 설정
# 톰캣 서버를 재시작 할 때 마다 고유 이름 생성을 비활성화
spring.datasource.generate-unique-name=false

#spring.datasource.url=jdbc:h2:mem:testdb

# MySQL 연동
spring.datasource.url=jdbc:mysql://localhost:3306/firstproject_db?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=0000
# 더미 데이터 초기화 할 정보 어디 있는지 설정
spring.datasource.data=classpath:/data.sql
# 서버를 껏다가 키면 매변 자동으로 더미 데이터를 초기화 하겠다 설정값 always 설정
# 서버를 껏다가 키면 매변 자동으로 더미 데이터를 초기화 하지 않고 저장된 값 고정으로 사용 never 설정
spring.datasource.initialization-mode=never
# JPA가 데이터베이스 테이블을 자동으로 생성하거나 수정하는 방식을 설정합니다.
# 'update'는 애플리케이션 실행 시, 엔티티(Entity) 클래스와 DB 테이블 구조를 비교하여
# 변경 사항이 있으면 기존 테이블을 유지하면서 수정(업데이트)합니다.
# 예: 새로운 필드가 생기면 컬럼 추가, 타입이 바뀌면 컬럼 변경 (단, 컬럼 삭제는 안 함)
spring.jpa.hibernate.ddl-auto=update



