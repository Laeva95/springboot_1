<!-- 1. HTML5 문서 타입을 선언하는 구문입니다. 브라우저가 이 문서를 HTML5 표준으로 해석하도록 지시합니다. -->
<!DOCTYPE html>
<!-- 2. html 태그의 시작. lang="en" 속성은 이 문서의 기본 언어가 영어임을 브라우저와 검색엔진에 알려주는 값입니다. -->
<html lang="en">
<!-- 3. head 태그 : 화면에 직접 출력되지는 않지만, 문서의 메타 정보(문자 인코딩, 제목 등)를 담는 영역입니다. -->
<head>
    <!-- 4. meta charset="UTF-8" : 이 문서의 문자 인코딩 방식을 UTF-8로 지정합니다.
         이 설정이 없거나 다르면 한글이 깨져 보일 수 있습니다. -->
    <meta charset="UTF-8">
    <!-- 5. title 태그 : 브라우저 탭(창 상단)에 표시되는 문서 제목을 지정합니다. -->
    <title>Title</title>
</head>
<!-- 6. body 태그 : 실제로 브라우저 화면에 출력되는 내용을 작성하는 영역입니다. -->
<body>
    <!-- 7. 정적(static) 파일이므로, 아래 텍스트는 Model 값이 아니라 고정된 문자열 그대로 출력됩니다.
         참고. static 디렉터리에 있는 파일은 컨트롤러(Controller)를 거치지 않고
         톰캣서버가 요청 URL과 파일 경로를 직접 매칭시켜 바로 응답합니다. -->
    헬로 월드!
</body>
</html>
